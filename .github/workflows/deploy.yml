name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🗄️ Gerar Prisma Client
        run: npx prisma generate

      - name: 🏗️ Build do Next.js
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 🔄 Criar arquivo de restart do Passenger
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      - name: 🗑️ Remover arquivos pesados antes do FTP
        run: |
          rm -rf node_modules
          rm -rf .next/cache
          sed -i '/\.next/d' .gitignore

      - name: 🚀 Enviar para o cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /bi.bvgarantia.com.br/
          # Sincroniza o código compilado e estrutura necessária
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            node_modules/**
            .next/cache/**
            .env
            scripts/**
            planilhas/**
