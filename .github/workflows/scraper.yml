name: Automação Diária - Scraper de Inadimplência

on:
  workflow_dispatch: # Permite disparar manualmente pela Vercel via API
  schedule:
    - cron: '0 4 * * *' # Executa todo dia às 4h da manhã UTC (1h BRT)

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🌐 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: ⚙️ Generate Prisma Clients
        run: |
          npx prisma generate
          npx prisma generate --schema=prisma/local.schema.prisma

      - name: 🚀 Run Automation Script
        run: npx tsx scripts/run_automation.ts
        env:
          NOVACORP_DB_URL: ${{ secrets.NOVACORP_DB_URL }}

      - name: 💾 Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add local.db public/data/automation_status.json public/aviso_importacao.txt
          # Só comita se houver mudanças
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Update database and status [skip ci]"
          git push origin main
